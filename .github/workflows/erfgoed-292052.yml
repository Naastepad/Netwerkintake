name: Erfgoed Goes 292052 PR extract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/erfgoed-292052.yml'
      - 'erfgoed-292052-trigger.txt'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --upgrade pip
          python -m pip install pdfplumber beautifulsoup4 lxml

      - name: Download source
        run: |
          mkdir -p output
          curl -fL --retry 4 --retry-delay 3 \
            'https://collecties.erfgoedvangoes.nl/detail.php?nav_id=3-1&index=13&imgid=53565439&id=292052' \
            -o output/detail_292052.html
          curl -fL --retry 4 --retry-delay 3 \
            'https://collecties.erfgoedvangoes.nl/HttpHandler/icoon.ico?file=53565439&pdfviewer=1' \
            -o output/source.pdf
          file output/source.pdf
          pdfinfo output/source.pdf | tee output/pdfinfo.txt
          pdftotext -layout output/source.pdf output/raw_text.txt

      - name: Extract tables
        run: |
          python <<'PY'
          import csv, hashlib, json, re
          from pathlib import Path
          import pdfplumber
          from bs4 import BeautifulSoup

          out = Path('output')
          detail_url = 'https://collecties.erfgoedvangoes.nl/detail.php?nav_id=3-1&index=13&imgid=53565439&id=292052'
          pdf_url = 'https://collecties.erfgoedvangoes.nl/HttpHandler/icoon.ico?file=53565439&pdfviewer=1'
          headers = [
              'pdf_pagina','folio','datum','verkoper','koper','eigendom','straat_ligging',
              'belending_oost','belending_zuid','belending_west','belending_noord','opmerkingen'
          ]

          html = (out/'detail_292052.html').read_text(encoding='utf-8', errors='replace')
          soup = BeautifulSoup(html, 'lxml')
          page_title = soup.title.get_text(' ', strip=True) if soup.title else ''
          meta = {}
          for tag in soup.find_all('meta'):
              key = tag.get('name') or tag.get('property')
              val = tag.get('content')
              if key and val:
                  meta[key] = val

          def clean(value):
              if value is None:
                  return ''
              return re.sub(r'\s+', ' ', str(value).replace('\r', ' ').replace('\n', ' ')).strip()

          rows = []
          page_table_counts = []
          with pdfplumber.open(out/'source.pdf') as pdf:
              page_count = len(pdf.pages)
              pdf_metadata = pdf.metadata or {}
              for pno, page in enumerate(pdf.pages, 1):
                  tables = page.extract_tables() or []
                  page_rows = 0
                  for table in tables:
                      for raw in table or []:
                          if not raw:
                              continue
                          vals = [clean(v) for v in raw]
                          if not any(vals):
                              continue
                          joined = ' '.join(vals).lower()
                          if vals[0].lower() == 'folio' or ('folio' in joined and 'datum' in joined and 'verkoper' in joined):
                              continue
                          if len(vals) < 10:
                              vals += [''] * (10 - len(vals))
                          elif len(vals) > 10:
                              vals = vals[:9] + [' '.join(vals[9:])]

                          folio, datum = vals[0], vals[1]
                          looks_new = bool(folio) and (bool(re.search(r'\d', folio)) or bool(datum))
                          if not looks_new and rows and rows[-1][0] == pno:
                              previous = rows[-1]
                              for idx, value in enumerate(vals, start=1):
                                  if value:
                                      previous[idx] = (previous[idx] + ' ' + value).strip()
                              continue

                          rows.append([pno] + vals + [''])
                          page_rows += 1
                  page_table_counts.append([pno, len(tables), page_rows])

          deduped, seen = [], set()
          for row in rows:
              key = tuple(row)
              if key not in seen:
                  seen.add(key)
                  deduped.append(row)
          rows = deduped

          nisse_re = re.compile(r'(?<![A-Za-zÀ-ÿ])(Nissepadt|Nissepat|Nissepad|Nisse)(?![A-Za-zÀ-ÿ])', re.I)
          nisse_rows = [row for row in rows if nisse_re.search(' | '.join(map(str, row)))]

          with (out/'all_rows.csv').open('w', newline='', encoding='utf-8-sig') as handle:
              writer = csv.writer(handle)
              writer.writerow(headers)
              writer.writerows(rows)

          with (out/'nissepat_matches.csv').open('w', newline='', encoding='utf-8-sig') as handle:
              writer = csv.writer(handle)
              writer.writerow(headers)
              writer.writerows(nisse_rows)

          summary = {
              'record_id': '292052',
              'imgid': '53565439',
              'detail_url': detail_url,
              'pdf_url': pdf_url,
              'page_title': page_title,
              'meta': meta,
              'pdf_metadata': pdf_metadata,
              'page_count': page_count,
              'row_count': len(rows),
              'nisse_count': len(nisse_rows),
              'first_row': rows[0] if rows else None,
              'last_row': rows[-1] if rows else None,
              'page_table_counts': page_table_counts,
              'pdf_sha256': hashlib.sha256((out/'source.pdf').read_bytes()).hexdigest(),
              'pdf_bytes': (out/'source.pdf').stat().st_size,
          }
          (out/'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          with (out/'summary.txt').open('w', encoding='utf-8') as handle:
              handle.write(f"HTML title: {page_title}\n")
              handle.write(f"PDF pages: {page_count}\n")
              handle.write(f"Rows: {len(rows)}\n")
              handle.write(f"Nisse matches: {len(nisse_rows)}\n")
              handle.write(f"First: {rows[0] if rows else None}\n")
              handle.write(f"Last: {rows[-1] if rows else None}\n")
              handle.write(f"PDF metadata: {pdf_metadata}\n")
              handle.write(f"PDF SHA256: {summary['pdf_sha256']}\n\n")
              for row in nisse_rows:
                  handle.write('NISSE: ' + ' | '.join(map(str, row)) + '\n')

          print((out/'summary.txt').read_text(encoding='utf-8'))
          PY

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: erfgoed-goes-292052
          path: output/
          if-no-files-found: error
          retention-days: 7
