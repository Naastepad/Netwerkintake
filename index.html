<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MGN Routekaart</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui;background:#faf8f6;color:#332d36}#s{padding:24px;text-align:center}</style></head><body><div id="s">Routekaart laden…</div><script>(async()=>{try{const f=['gz2/00.b64','gz2/01-02.b64','gz3/03.b64','gz3/04.b64','gz3/05.b64','gz2/06-07.b64','gz2/08-09.b64','gz2/10-11.b64','gz3/12.b64','gz3/13.b64','gz2/14-15.b64','gz2/16-17.b64','gz2/18-19.b64','gz3/20.b64'],p=[];for(const x of f){const r=await fetch(x,{cache:'no-store'});if(!r.ok)throw Error(x+': '+r.status);p.push((await r.text()).trim())}const b=atob(p.join('')),g=Uint8Array.from(b,c=>c.charCodeAt(0)),z=new Blob([g]).stream().pipeThrough(new DecompressionStream('gzip')),h=await new Response(z).text();document.open();document.write(h);document.close()}catch(e){console.error(e);document.getElementById('s').innerHTML='<b>De routekaart kon niet worden geladen.</b><br>Vernieuw de pagina in Safari.'}})()</script></body></html>
